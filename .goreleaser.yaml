version: 2

project_name: glimpse

before:
  hooks:
    - go mod tidy
    # The binary writes its own completions, as in make install.
    - rm -rf completions
    - mkdir completions
    - sh -c 'go run ./cmd/glimpse --completion bash > completions/glimpse.bash'
    - sh -c 'go run ./cmd/glimpse --completion zsh > completions/_glimpse'
    - sh -c 'go run ./cmd/glimpse --completion fish > completions/glimpse.fish'
    - sh -c 'go run ./cmd/glimpse --completion nushell > completions/glimpse.nu'

builds:
  - main: ./cmd/glimpse
    binary: glimpse
    env:
      - CGO_ENABLED=0
    # glimpse is Unix-only; see .github/workflows/test.yml.
    goos: [linux, darwin, freebsd]
    goarch: [amd64, arm64]
    ignore:
      - goos: freebsd
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/araaha/glimpse/cmd/glimpse/command.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - docs/glimpse.1
      - completions/*
      - glimpse.toml

# .deb and .rpm packages for Debian, Ubuntu and Fedora, attached to the release.
nfpms:
  - package_name: glimpse
    homepage: https://github.com/araaha/glimpse
    maintainer: araaha <ara.ahady@gmail.com>
    description: A terminal pager for files and streams
    license: GPL-3.0-or-later
    formats: [deb, rpm]
    section: utils
    contents:
      - src: docs/glimpse.1
        dst: /usr/share/man/man1/glimpse.1
      - src: completions/glimpse.bash
        dst: /usr/share/bash-completion/completions/glimpse
      # Debian's zsh does not search site-functions.
      - src: completions/_glimpse
        dst: /usr/share/zsh/vendor-completions/_glimpse
        packager: deb
      - src: completions/_glimpse
        dst: /usr/share/zsh/site-functions/_glimpse
        packager: rpm
      - src: completions/glimpse.fish
        dst: /usr/share/fish/vendor_completions.d/glimpse.fish
      - src: completions/glimpse.nu
        dst: /usr/share/nushell/vendor/autoload/glimpse.nu
      - src: glimpse.toml
        dst: /usr/share/doc/glimpse/glimpse.toml
      - src: LICENSE
        dst: /usr/share/doc/glimpse/copyright
        packager: deb
      - src: LICENSE
        dst: /usr/share/licenses/glimpse/LICENSE
        packager: rpm

# AUR packages; both need the AUR_KEY secret. The name glimpse is taken on the
# AUR by an unrelated program, which also installs /usr/bin/glimpse.
aurs:
  - name: glimpse-pager-bin
    homepage: https://github.com/araaha/glimpse
    description: A terminal pager for files and streams
    maintainers:
      - araaha <ara.ahady at gmail dot com>
    license: GPL-3.0-or-later
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/glimpse-pager-bin.git
    skip_upload: auto
    provides: [glimpse-pager]
    conflicts: [glimpse-pager, glimpse]
    package: |-
      install -Dm755 glimpse "${pkgdir}/usr/bin/glimpse"
      install -Dm644 docs/glimpse.1 "${pkgdir}/usr/share/man/man1/glimpse.1"
      install -Dm644 completions/glimpse.bash "${pkgdir}/usr/share/bash-completion/completions/glimpse"
      install -Dm644 completions/_glimpse "${pkgdir}/usr/share/zsh/site-functions/_glimpse"
      install -Dm644 completions/glimpse.fish "${pkgdir}/usr/share/fish/vendor_completions.d/glimpse.fish"
      install -Dm644 completions/glimpse.nu "${pkgdir}/usr/share/nushell/vendor/autoload/glimpse.nu"
      install -Dm644 glimpse.toml "${pkgdir}/usr/share/doc/${pkgname}/glimpse.toml"
      install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"

aur_sources:
  - name: glimpse-pager
    homepage: https://github.com/araaha/glimpse
    description: A terminal pager for files and streams
    maintainers:
      - araaha <ara.ahady at gmail dot com>
    license: GPL-3.0-or-later
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/glimpse-pager.git
    skip_upload: auto
    provides: [glimpse-pager]
    conflicts: [glimpse-pager-bin, glimpse]
    makedepends: [go]
    # The source tarball has no top-level directory; it unpacks into $srcdir.
    prepare: |-
      go mod download
    build: |-
      export CGO_CPPFLAGS="${CPPFLAGS}"
      export CGO_CFLAGS="${CFLAGS}"
      export CGO_CXXFLAGS="${CXXFLAGS}"
      export CGO_LDFLAGS="${LDFLAGS}"
      export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
      go build -ldflags="-linkmode=external -X github.com/araaha/glimpse/cmd/glimpse/command.Version=${pkgver}" -o glimpse ./cmd/glimpse
    package: |-
      install -Dm755 glimpse "${pkgdir}/usr/bin/glimpse"
      install -Dm644 docs/glimpse.1 "${pkgdir}/usr/share/man/man1/glimpse.1"
      install -d "${pkgdir}/usr/share/bash-completion/completions" "${pkgdir}/usr/share/zsh/site-functions" \
        "${pkgdir}/usr/share/fish/vendor_completions.d" "${pkgdir}/usr/share/nushell/vendor/autoload"
      ./glimpse --completion bash > "${pkgdir}/usr/share/bash-completion/completions/glimpse"
      ./glimpse --completion zsh > "${pkgdir}/usr/share/zsh/site-functions/_glimpse"
      ./glimpse --completion fish > "${pkgdir}/usr/share/fish/vendor_completions.d/glimpse.fish"
      ./glimpse --completion nushell > "${pkgdir}/usr/share/nushell/vendor/autoload/glimpse.nu"
      install -Dm644 glimpse.toml "${pkgdir}/usr/share/doc/${pkgname}/glimpse.toml"
      install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"

# The source tarball the glimpse-pager AUR package builds from.
source:
  enabled: true

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
