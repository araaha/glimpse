name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./cmd/glimpse
      - run: go test -race ./...

  # Platforms without a runner: check that they still compile.
  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [freebsd/amd64, openbsd/amd64, linux/arm64, windows/arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/}
          go vet ./...
        env:
          TARGET: ${{ matrix.target }}
