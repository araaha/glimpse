<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="glimpse logo">
  <title>glimpse</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#151925"/>
    </linearGradient>
    <!-- The eye: everything inside is in view, the rest is only glimpsed. -->
    <clipPath id="eye">
      <path d="M28 128 Q128 34 228 128 Q128 222 28 128 Z"/>
    </clipPath>
    <g id="lines">
      <rect x="40" y="70" width="120" height="12" rx="6"/>
      <rect x="40" y="94" width="168" height="12" rx="6"/>
      <rect x="40" y="146" width="148" height="12" rx="6"/>
      <rect x="40" y="170" width="96" height="12" rx="6"/>
      <rect x="40" y="194" width="132" height="12" rx="6"/>
      <rect x="40" y="46" width="88" height="12" rx="6"/>
    </g>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>

  <!-- Text outside the eye is dimmed. -->
  <use href="#lines" fill="#e8ecf4" opacity="0.12"/>

  <g clip-path="url(#eye)">
    <path d="M28 128 Q128 34 228 128 Q128 222 28 128 Z" fill="#1b2030"/>
    <use href="#lines" fill="#cdd5e4"/>
    <!-- The current line: a search match, with the cursor block after it. -->
    <rect x="40" y="120" width="64" height="16" rx="8" fill="#cdd5e4"/>
    <rect x="114" y="117" width="74" height="22" rx="7" fill="#f6c453"/>
    <rect x="196" y="117" width="12" height="22" rx="3" fill="#7aa2f7"/>
  </g>

  <path d="M28 128 Q128 34 228 128 Q128 222 28 128 Z" fill="none" stroke="#7aa2f7" stroke-width="6" stroke-linejoin="round"/>
</svg>
